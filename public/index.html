<!DOCTYPE html>
<html lang="zh">
<head>
    <script>
        // 主题初始化：亮色为默认，首屏渲染前设定，避免闪烁
        (function () {
            var t = localStorage.getItem('talk4us_theme');
            document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        })();
        if (!localStorage.getItem('talk4us_visited')) {
            window.location.replace('/landing.html');
        }
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk4us, 会聊，让翻译更得体</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lang.js"></script>
    <script src="theme.js"></script>
</head>
<body>
    <div id="authOverlay" class="pin-overlay hidden" style="display: none;">
        <div class="pin-box" style="width: 340px;">
            <h2 data-i18n="sysAuth">SYSTEM AUTH</h2>
            <p data-i18n="loginUnlock">登录解锁更多AI 模型</p>
            <input type="email" id="emailInput" placeholder="电子邮箱" data-i18n-placeholder="email" autocomplete="on" class="auth-field">
            <input type="password" id="passwordInput" placeholder="密码" data-i18n-placeholder="pwd" autocomplete="off" class="auth-field">
            
            <div class="auth-btn-group">
                <button id="loginBtn" class="auth-primary-btn" data-i18n="login">登录</button>
                <button id="signupBtn" class="auth-secondary-btn" data-i18n="signup">注册</button>
            </div>
            
            <button id="guestBtn" class="auth-guest-link" data-i18n="guestMode">暂不登录，直接体验 (仅限默认模型)</button>
            <p id="authError" class="pin-error"></p>
        </div>
    </div>

    <div class="app-window">
        <div class="window-header">
            <div class="window-title" data-i18n="appTitle">Talk4us, 优雅沟通</div>
            <div class="header-actions" style="position: absolute; right: 15px; display: flex; align-items: center; gap: 12px;">
                <button id="themeToggleBtn" class="theme-toggle" title="切换主题">
                    <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
                <button id="langToggleBtn" class="lang-btn">CN</button>
                <button id="logoutBtn" class="icon-btn" title="退出登录" style="display: none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </div>

        <div class="workspace">
            <div class="panel left-panel">
                <div class="panel-header">
                    <div class="header-title">
                        <span class="dot">●</span> <span data-i18n="youTyped">YOU TYPED</span>
                    </div>
                    <button id="pasteBtn" class="icon-btn" title="粘贴">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                    </button>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="userInput" placeholder="输入需重构的话语（支持多语言混合）..." data-i18n-placeholder="placeholderText"></textarea>
                    <div id="charCount" class="char-count">0/500</div>
                </div>  
                
                
                <div class="panel-footer">
                    <div class="select-group">
                        <span class="group-label" data-i18n="scene">场景</span>
                            <select id="contextSelect">
                                <option value="auto" selected data-i18n="auto">自动检测 (Auto)</option>
                                <optgroup label="高压博弈场景" data-i18n-label="groupHighPressure">
                                    <option value="advocacy" data-i18n="advocacy">维权交涉</option>
                                    <option value="upward" data-i18n="upward">向上管理</option>
                                    <option value="boundary" data-i18n="boundary">催促or拒绝</option>
                                    <option value="cold_reach" data-i18n="coldReach">弱连接增强</option>
                                </optgroup>
                                <optgroup label="常规职业场景" data-i18n-label="groupRoutine">
                                    <option value="internal" data-i18n="internal">内部协作</option>
                                    <option value="business" data-i18n="business">商业沟通</option>
                                    <option value="social" data-i18n="social">轻松社交</option>
                                </optgroup>
                            </select>
                    </div>
                </div>
            </div>

            <button id="submitBtn">
                <span id="submitBtnText" data-i18n="btnSubmit">重构</span>
                <span class="shortcut">(Cmd/Ctrl + Enter)</span>
            </button>

            <div class="panel right-panel">
                <div class="panel-header gold">
                    <div class="header-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        <span data-i18n="suggests">SUGGESTS</span>
                    </div>
                    <button id="copyBtn" class="icon-btn" title="复制">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
                <div id="outputContent" class="output-content">
                    <p id="suggestionText" class="suggestion-text empty-state" data-i18n="emptyState">等待输入内容...</p>
                    <div class="rationale-box">
                        <span class="icon">💡</span>
                        <span id="rationaleText" data-i18n="rationale">AI 分析将在此处显示</span>
                    </div>
                </div>
                
                <div class="panel-footer">
                    <div class="select-group">
                        <span class="group-label" data-i18n="output">输出</span>
                        <select id="outputLangSelect">
                            <option value="zh" selected data-i18n="zhOut">中文</option>
                            <option value="en" data-i18n="enOut">英文</option>
                            <option value="jp" data-i18n="jpOut">日语</option>
                        </select>
                    </div>
                </div>
            </div>
        </div> 

        <div class="window-footer">
            <div class="select-group">
                <span class="group-label" data-i18n="aiEngine">AI引擎</span>
                <select id="modelSelect">
                    <option value="glm" selected>GLM 4 Flash</option>
                    <!-- [暂时不用] 百炼 Key 失效，已备注 <option value="qwen" disabled>Qwen 3.8 flash</option> -->
                    <option value="deepseek" disabled>DeepSeek V4 flash</option>
                </select>
                <button id="triggerLoginBtn" class="auth-guest-link" style="margin-left: 12px; font-size: 0.8rem;" data-i18n="loginForMore">
                    登录使用更多模型
                </button>
            </div>
        </div>
    </div>
    

    <div class="app-footer">
        <span data-i18n="appDesc">&copy; 我们不翻译，只是帮你更专业、优雅地表达想法。</span>
        <span class="divider">|</span>
        <a href="https://github.com/wolfpan/talk4us" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
            <span data-i18n="githubLink">GitHub</span>
        </a>
    </div>


    <script src="app.js"></script>
    <script type="text/javascript">
    var sc_project=13289815; 
    var sc_invisible=1; 
    var sc_security="55f285ba"; 
    </script>

    </body>
</html>
